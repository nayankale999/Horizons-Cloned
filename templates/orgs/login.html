{% load static %}<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ SITE_NAME }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.4/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="login-page bg-body-secondary">
<div class="login-box">
  <div class="card card-outline card-primary">
    <div class="card-header text-center"><h1 class="h3 mb-0"><i class="bi bi-graph-up-arrow me-2"></i>{{ SITE_NAME }}</h1></div>
    <div class="card-body login-card-body">
      <p class="login-box-msg">Sign in to start your session</p>
      {% if form.errors %}<div class="alert alert-danger py-2">Incorrect username or password.</div>{% endif %}
      <form method="post">{% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="input-group mb-3">
          <input type="text" name="username" class="form-control" placeholder="Username" autocomplete="username" required autofocus>
          <div class="input-group-text"><i class="bi bi-person"></i></div>
        </div>
        <div class="input-group mb-3">
          <input type="password" name="password" class="form-control" placeholder="Password" autocomplete="current-password" required>
          <div class="input-group-text"><i class="bi bi-lock"></i></div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
